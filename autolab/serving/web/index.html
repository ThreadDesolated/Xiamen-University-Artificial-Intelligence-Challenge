<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoLab · 实验工作台</title>
<link rel="stylesheet" href="/panel/style.css?v=9">
</head>
<body>
<header>
  <strong>AutoLab</strong>
  <span>科研实验工作台</span>
  <div id="stats" class="head-stats" title="SQLite 经验库：成功配方与失败归因的累积规模">配方库 — · 归因库 —</div>
  <a href="/docs" target="_blank" rel="noopener">接口文档 ↗</a>
</header>

<div class="layout">
  <aside>
    <h2>实验任务</h2>
    <label for="task">选择任务</label>
    <select id="task" disabled><option>正在加载任务…</option></select>
    <p id="tasknote" class="muted"></p>

    <label for="goal" class="goal-label">实验目标 <span class="muted">可选，用一句话描述</span></label>
    <div class="goal-box">
      <textarea id="goal" rows="3" placeholder="例：把验证准确率做到 0.86 以上，预算 90 秒，最多 2 轮"></textarea>
      <button id="mic" class="mic" type="button" title="语音输入" aria-label="语音输入" hidden>🎙</button>
    </div>
    <p id="goalhint" class="muted">可留空，直接使用任务默认阈值与预算</p>

    <label class="check"><input id="recipe" type="checkbox" checked>复用成功配方（含跨任务迁移）</label>
    <label class="check"><input id="llm" type="checkbox" checked>使用大模型规划与归因（不可用时自动回退模板/规则）</label>
    <p id="llmhint" class="muted"></p>
    <button id="start" disabled>开始实验</button>
    <p id="message" role="status" aria-live="polite"></p>

    <hr>
    <div class="heading"><h2>实验历史</h2><button id="refresh" class="text">刷新</button></div>
    <div class="batchbar">
      <label class="pickall"><input id="pickall" type="checkbox">全选</label>
      <button id="batchdel" class="del" disabled>删除所选</button>
    </div>
    <div id="history">正在加载…</div>
  </aside>

  <main>
    <h1>实验工作台</h1>

    <div class="metrics">
      <div><span id="metriclabel">当前指标</span><strong id="score">—</strong></div>
      <div><span id="targetlabel">目标阈值</span><strong id="target">—</strong></div>
      <div>实验轮次<strong id="round">—</strong></div>
      <div>留出集复验<strong id="holdout" title="仅在任务启用 holdout_ratio 时提供，不参与达标判定">—</strong></div>
    </div>

    <section class="chart-card">
      <div class="heading"><h2>指标曲线</h2><span id="chartnote" class="muted"></span></div>
      <div id="chart" class="chart"><p class="muted">每轮实验结束后在这里画出指标走势</p></div>
    </section>

    <section class="plan-card">
      <div class="heading"><h2>实验方案</h2><div id="planbadges" class="badges"></div></div>
      <div id="plan"><p class="muted">选择任务后自动生成方案草案</p></div>
    </section>

    <section>
      <div class="heading">
        <h2>实验轨迹</h2>
        <div class="links"><a id="report" hidden target="_blank" rel="noopener">查看实验报告 ↗</a><a id="model" hidden target="_blank" rel="noopener">下载模型 ↓</a></div>
      </div>
      <p id="runstatus" class="muted"></p>
      <div id="timeline">
        <div class="empty"><div class="rail">○<br>│<br>○<br>│<br>○</div><h3>选择任务，开始一次实验</h3><p>实验轨迹会通过 SSE 实时推送到这里</p></div>
      </div>
    </section>
  </main>
</div>
<script src="/panel/app.js?v=9"></script>
</body>
</html>
