<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoLab · 实验工作台</title><link rel="stylesheet" href="/panel/style.css"><header><strong>AutoLab</strong><span>科研实验工作台</span><a href="/docs" target="_blank">接口文档 ↗</a></header><div class="layout"><aside><h2>实验任务</h2><label for="task">选择任务</label><select id="task" disabled><option>正在加载任务…</option></select><p id="tasknote" class="muted"></p><label class="check"><input id="recipe" type="checkbox">复用成功配方</label><button id="start" disabled>开始实验</button><p id="message" role="status" aria-live="polite"></p><hr><div class="heading"><h2>实验历史</h2><button id="refresh" class="text">刷新</button></div><div class="batchbar"><label class="pickall"><input id="pickall" type="checkbox">全选</label><button id="batchdel" class="del" disabled>删除所选</button></div><div id="history">正在加载…</div></aside><main><h1>实验工作台</h1><div class="metrics"><div>当前指标<strong id="score">—</strong></div><div>目标阈值<strong id="target">—</strong></div><div>实验轮次<strong id="round">—</strong></div><div>留出集复验<strong id="holdout" title="仅在任务启用 holdout_ratio 时提供，不参与达标判定">—</strong></div></div><section><div class="heading"><h2>实验轨迹</h2><a id="report" hidden target="_blank" rel="noopener">查看实验报告 ↗</a></div><p id="runstatus" class="muted"></p><div id="timeline"><div class="empty"><div class="rail">○<br>│<br>○<br>│<br>○</div><h3>选择任务，开始一次实验</h3><p>实验轨迹将在开始实验后实时展示</p></div></div></section></main></div><script src="/panel/app.js"></script></html>
